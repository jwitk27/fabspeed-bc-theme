{{#partial "page"}}
<div class="customer-service-review">
    <form id="customer-service-review-form">
        <div class="star-rating-field">
            <p>How would you rate the website overall</p>
            <input id="website_rating_1" class="star-rating-input" type="radio" name="website_rating" value="1">
            <label for="website_rating" class="star-rating-label">&#9733;</label>
            <input id="website_rating_2" class="star-rating-input" type="radio" name="website_rating" value="2">
            <label for="website_rating" class="star-rating-label">&#9733;</label>
            <input id="website_rating_3" class="star-rating-input" type="radio" name="website_rating" value="3">
            <label for="website_rating" class="star-rating-label">&#9733;</label>
            <input id="website_rating_4" class="star-rating-input" type="radio" name="website_rating" value="4">
            <label for="website_rating" class="star-rating-label">&#9733;</label>
            <input id="website_rating_5" class="star-rating-input" type="radio" name="website_rating" value="5">
            <label for="website_rating" class="star-rating-label">&#9733;</label>
        </div>

        <div class="star-rating-field">
            <p>How was the shopping experience</p>
            <input id="shopping_experience_1" class="star-rating-input" type="radio" name="shopping_experience" value="1">
            <label for="shopping_experience" class="star-rating-label">&#9733;</label>
            <input id="shopping_experience_2" class="star-rating-input" type="radio" name="shopping_experience" value="2">
            <label for="shopping_experience" class="star-rating-label">&#9733;</label>
            <input id="shopping_experience_3" class="star-rating-input" type="radio" name="shopping_experience" value="3">
            <label for="shopping_experience" class="star-rating-label">&#9733;</label>
            <input id="shopping_experience_4" class="star-rating-input" type="radio" name="shopping_experience" value="4">
            <label for="shopping_experience" class="star-rating-label">&#9733;</label>
            <input id="shopping_experience_5" class="star-rating-input" type="radio" name="shopping_experience" value="5">
            <label for="shopping_experience" class="star-rating-label">&#9733;</label>
        </div>

        <div class="star-rating-field">
            <p>How was the checkout experience</p>
            <input id="checkout_experience_1" class="star-rating-input" type="radio" name="checkout_experience" value="1">
            <label for="checkout_experience" class="star-rating-label">&#9733;</label>
            <input id="checkout_experience_2" class="star-rating-input" type="radio" name="checkout_experience" value="2">
            <label for="checkout_experience" class="star-rating-label">&#9733;</label>
            <input id="checkout_experience_3" class="star-rating-input" type="radio" name="checkout_experience" value="3">
            <label for="checkout_experience" class="star-rating-label">&#9733;</label>
            <input id="checkout_experience_4" class="star-rating-input" type="radio" name="checkout_experience" value="4">
            <label for="checkout_experience" class="star-rating-label">&#9733;</label>
            <input id="checkout_experience_5" class="star-rating-input" type="radio" name="checkout_experience" value="5">
            <label for="checkout_experience" class="star-rating-label">&#9733;</label>
        </div>

        <input id="customer-service-review-submit" type="submit" value="submit" class="button button--primary">
    </form>
</div>
{{/partial}}
{{> layout/base}}
