<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {{#each breadcrumbs}}
      {{#if @last}}
        {"@type": "ListItem", "position": {{add @index 1}}, "name": "{{name}}", "item": "{{url}}"}
      {{else}}
        {"@type": "ListItem", "position": {{add @index 1}}, "name": "{{name}}", "item": "{{url}}"},
      {{/if}}
    {{/each}}
  ]
}
</script>
