{{{ snippet "forms_search"}}}
<form class="form" action="{{urls.search}}">
    <fieldset class="form-fieldset">
        <div class="form-field">
            <input class="form-input" data-search-quick name="search_query" id="search_query_old" data-error-message="{{lang 'search.error.empty_field'}}" placeholder="{{lang 'search.quick_search.input_quickSearch'}}" autocomplete="off">
            <button class="btn-search" type="submit"><svg class="icon"><use xlink:href="#icon-search"></use></svg></button>
        </div>
    </fieldset>
</form>
<div class="quickSearchResults" data-bind="html: results"></div>
