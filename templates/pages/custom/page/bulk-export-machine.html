{{#partial "page"}}
<div class="bulk-export-machine">
  <h1>Bulk Export Machine</h1>

  <p>Instructions:</p>
  <p>Export products with the "Price List" option, then upload that file and click the "Download" button</p>

  <div class="bem-row">
    <input type="file" id="bem-file" accept=".csv" />

    <select id="bem-topcat" disabled>
      <option value="__all__">All categories</option>
    </select>

    <button id="bem-download-price-list" class="button" disabled>
      Download
    </button>
  </div>

  <p id="bem-status"></p>

  <div id="bem-preview-table"></div>
</div>
{{/partial}}
{{> layout/base}}
