{{#each product.custom_fields}}
{{#if name '===' 'beforeafter'}}
{{#or (if ../id '==' '51542') (if ../id '==' '51347')}}
<h2>A Peak Behind the Curtains</h2>
{{else}}
<h2>Compare OEM vs <span class="fabspeed-red">Fabspeed</span></h2>
{{/or}}
<section class="image-comparison" data-component="image-comparison-slider">
    <div class="image-comparison__slider-wrapper">
        <label for="image-comparison-range" class="image-comparison__label">Move image comparison slider</label>
        <input type="range" min="0" max="100" value="50" class="image-comparison__range" id="image-compare-range"
            data-image-comparison-range="">

        <div class="image-comparison__image-wrapper  image-comparison__image-wrapper--overlay"
            data-image-comparison-overlay="">
            <figure class="image-comparison__figure image-comparison__figure--overlay">
                <picture class="image-comparison__picture">
                    <img src="https://store-fh9wsjv2.mybigcommerce.com/content/images/before-after-slider-images/{{value}}-OEM.jpg"
                        alt="oem part" class="image-comparison__image">
                </picture>

                <figcaption class="image-comparison__caption image-comparison__caption--before">
                    {{#or (if ../id '==' '51542') (if ../id '==' '51347')}}
                    {{else}}
                    <span class="image-comparison__caption-body">OEM</span>
                    {{/or}}
                </figcaption>
            </figure>
        </div>

        <div class="image-comparison__slider" data-image-comparison-slider="">
            <span class="image-comparison__thumb" data-image-comparison-thumb="">
                <svg class="image-comparison__thumb-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="10"
                    viewBox="0 0 18 10" fill="currentColor">
                    <path class="image-comparison__thumb-icon--left"
                        d="M12.121 4.703V.488c0-.302.384-.454.609-.24l4.42 4.214a.33.33 0 0 1 0 .481l-4.42 4.214c-.225.215-.609.063-.609-.24V4.703z">
                    </path>
                    <path class="image-comparison__thumb-icon--right"
                        d="M5.879 4.703V.488c0-.302-.384-.454-.609-.24L.85 4.462a.33.33 0 0 0 0 .481l4.42 4.214c.225.215.609.063.609-.24V4.703z">
                    </path>
                </svg>
            </span>
        </div>
        <div class="image-comparison__image-wrapper">
            <figure class="image-comparison__figure">
                <picture class="image-comparison__picture">
                    <img src="https://store-fh9wsjv2.mybigcommerce.com/content/images/before-after-slider-images/{{value}}-FAB.jpg"
                        alt="fabspeed part" class="image-comparison__image">
                </picture>

                <figcaption class="image-comparison__caption image-comparison__caption--after">
                    {{#or (if ../id '==' '51542') (if ../id '==' '51347')}}
                    {{else}}
                    <span class="image-comparison__caption-body">FABSPEED</span>
                    {{/or}}
                </figcaption>
            </figure>
        </div>
    </div>
</section>
{{/if}}
{{/each}}

<script>
    const imageComparisonSlider = document.querySelector('[data-component="image-comparison-slider"]');

    if (imageComparisonSlider) {

        imageComparisonSlider.addEventListener('touchstart', () => {
            document.querySelector('body').classList.add('noscroll');
        });
        
        imageComparisonSlider.addEventListener('touchend', () => {
            document.querySelector('body').classList.remove('noscroll');
        });

        function setSliderstate(e, element) {
            const sliderRange = element.querySelector('[data-image-comparison-range]');

            if (e.type === 'input') {
                sliderRange.classList.add('image-comparison__range--active');
                return;
            }

            sliderRange.classList.remove('image-comparison__range--active');
            element.removeEventListener('mousemove', moveSliderThumb);
        }

        function moveSliderThumb(e) {
            const sliderRange = document.querySelector('[data-image-comparison-range]');
            const thumb = document.querySelector('[data-image-comparison-thumb]');
            let position = e.layerY - 20;

            if (e.layerY <= sliderRange.offsetTop) {
                position = -20;
            }

            if (e.layerY >= sliderRange.offsetHeight) {
                position = sliderRange.offsetHeight - 20;
            }

            thumb.style.top = `${position}px`;
        }

        function moveSliderRange(e, element) {
            const value = e.target.value;
            const slider = element.querySelector('[data-image-comparison-slider]');
            const imageWrapperOverlay = element.querySelector('[data-image-comparison-overlay]');

            slider.style.left = `${value}%`;
            imageWrapperOverlay.style.width = `${value}%`;

            element.addEventListener('mousemove', moveSliderThumb);
            setSliderstate(e, element);
        }

        function init(element) {
            const sliderRange = element.querySelector('[data-image-comparison-range]');

            if ('ontouchstart' in window === false) {
                sliderRange.addEventListener('mouseup', e => setSliderstate(e, element));
                sliderRange.addEventListener('mousedown', moveSliderThumb);
            }

            sliderRange.addEventListener('input', e => moveSliderRange(e, element));
            sliderRange.addEventListener('change', e => moveSliderRange(e, element));
        }

        init(imageComparisonSlider);
    }

</script>
